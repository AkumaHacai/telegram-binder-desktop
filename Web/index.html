<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"><title>Telegram Binder</title><link rel="stylesheet" href="app.css"><script defer src="app.js"></script></head>
<body>
<div class="shell">
<header class="masthead">
  <h1><img class="brand-mark" src="brand-mark.png" width="22" height="22" alt="">Telegram Binder</h1>
  <div class="window-actions">
    <button type="button" class="minimize" aria-label="Свернуть на панель задач" title="Свернуть на панель задач"></button>
    <button type="button" class="maximize" aria-label="Развернуть" title="Развернуть"></button>
    <button type="button" class="hide" aria-label="Свернуть в трей" title="Свернуть в трей"></button>
  </div>
</header>
<main><section class="library" aria-label="Шаблоны">
          <div class="library-head"><h2>Шаблоны</h2><span class="count"></span></div>
          <div class="toolbar">
            <input class="search" type="search" placeholder="Поиск шаблонов" aria-label="Поиск шаблонов">
            <div class="toolbar-right"><select class="filter" aria-label="Фильтр по папке"></select><button class="secondary add-folder" type="button" title="Новая папка">+ Папка</button><button class="ghost delete-folder" type="button" title="Удалить выбранную папку">−</button></div>
          </div>
          <div class="row import-row"><button class="ghost import" type="button">Импорт JSON</button><button class="ghost export" type="button">Экспорт JSON</button></div>
          <div class="list"></div>
</section><section class="editor" aria-label="Редактор">          <form class="editing">
            <h3 class="form-title">Новая команда</h3>
            <div class="form-grid">
              <label class="field">Команда<input class="command" type="text" maxlength="33" spellcheck="false" placeholder=".сап" required></label>
              <label class="field">Папка<select class="folder"></select></label>
            </div>
            <label class="field">Описание для подсказки<input class="description" type="text" maxlength="200" placeholder="Например: Ответ на обращение"></label>
            <div class="variant-toolbar">
              <label class="field variant-select-wrap">Вариант ответа<select class="variants"></select></label>
              <button class="secondary add-variant" type="button" title="Добавить вариант">+ Вариант</button>
              <button class="ghost remove-variant" type="button" title="Удалить выбранный вариант">Удалить вариант</button>
            </div>
            <label class="field">Название варианта<input class="variant-label" type="text" maxlength="80" placeholder="Основной"></label>
            <label class="field">Текст ответа<textarea class="message" maxlength="20000" placeholder="Введите текст шаблона" required></textarea></label>
            <div class="rich-info"><span class="rich-state">Обычный текст</span><button class="secondary capture" type="button">Взять из буфера</button><button class="secondary copy-rich" type="button">Копировать ответ</button></div>
            <p class="hint">Ctrl+Shift+B в Telegram захватывает весь черновик.</p>
            <div class="row"><button class="primary save" type="submit">Создать команду</button><button class="ghost reset" type="button">Сбросить форму</button></div>
          </form>
</section></main><footer class="status" role="status" aria-live="polite">Загружаем шаблоны…</footer>
</div></body></html>
